<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 796 234" width="796" height="234" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<rect width="796" height="234" fill="#ffffff"/>
<g transform="translate(14,14)">
<rect x="0" y="0" width="248" height="206" rx="2" fill="#ffffff" stroke="#E6E7E3"/>
<text x="12" y="24" font-size="12.5" font-weight="600" fill="#171C1A">1 · Rule influence out</text>
<g transform="translate(29,38)"><line x1="14" y1="26" x2="180" y2="26" stroke="#E6E7E3" stroke-dasharray="2 3"/><line x1="14" y1="64" x2="180" y2="64" stroke="#E6E7E3" stroke-dasharray="2 3"/><path d="M136,58 C98,38 86,48 55,30" fill="none" stroke="#C0562F" stroke-width="1.6" opacity=".5"/><line x1="88" y1="34" x2="108" y2="56" stroke="#C0562F" stroke-width="2.4"/><line x1="108" y1="34" x2="88" y2="56" stroke="#C0562F" stroke-width="2.4"/><circle cx="42" cy="26" r="12" fill="#fff" stroke="#2E7D63" stroke-width="2"/><text x="42" y="30" text-anchor="middle" font-size="11" font-weight="600" fill="#2E7D63">4</text><text x="42" y="9" text-anchor="middle" font-size="9.5" fill="#8C9491">A</text><circle cx="148" cy="64" r="12" fill="#fff" stroke="#C0562F" stroke-width="2"/><text x="148" y="68" text-anchor="middle" font-size="11" font-weight="600" fill="#C0562F">7</text><text x="148" y="47" text-anchor="middle" font-size="9.5" fill="#8C9491">B</text></g>
<text x="12" y="150" font-size="10.5" fill="#5D6764">Can we be certain B did not cause</text>
<text x="12" y="166" font-size="10.5" fill="#5D6764">A? A single counter is enough</text>
<text x="12" y="182" font-size="10.5" fill="#5D6764">for this.</text>
</g>
<g transform="translate(274,14)">
<rect x="0" y="0" width="248" height="206" rx="2" fill="#ffffff" stroke="#E6E7E3"/>
<text x="12" y="24" font-size="12.5" font-weight="600" fill="#171C1A">2 · Confirm causality</text>
<g transform="translate(29,38)"><line x1="14" y1="26" x2="180" y2="26" stroke="#E6E7E3" stroke-dasharray="2 3"/><line x1="14" y1="64" x2="180" y2="64" stroke="#E6E7E3" stroke-dasharray="2 3"/><path d="M55,31 C90,50 98,40 135,59" fill="none" stroke="#1B4D3E" stroke-width="1.6" stroke-dasharray="4 3"/><text x="98" y="50" text-anchor="middle" font-size="16" font-weight="600" fill="#1B4D3E">?</text><circle cx="42" cy="26" r="12" fill="#fff" stroke="#2E7D63" stroke-width="2"/><text x="42" y="30" text-anchor="middle" font-size="11" font-weight="600" fill="#2E7D63">4</text><text x="42" y="9" text-anchor="middle" font-size="9.5" fill="#8C9491">A</text><circle cx="148" cy="64" r="12" fill="#fff" stroke="#C0562F" stroke-width="2"/><text x="148" y="68" text-anchor="middle" font-size="11" font-weight="600" fill="#C0562F">7</text><text x="148" y="47" text-anchor="middle" font-size="9.5" fill="#8C9491">B</text></g>
<text x="12" y="150" font-size="10.5" fill="#5D6764">Can we be certain A did cause B?</text>
<text x="12" y="166" font-size="10.5" fill="#5D6764">The expensive one, and the same</text>
<text x="12" y="182" font-size="10.5" fill="#5D6764">question as detecting</text>
<text x="12" y="198" font-size="10.5" fill="#5D6764">concurrency.</text>
</g>
<g transform="translate(534,14)">
<rect x="0" y="0" width="248" height="206" rx="2" fill="#ffffff" stroke="#E6E7E3"/>
<text x="12" y="24" font-size="12.5" font-weight="600" fill="#171C1A">3 · Total order</text>
<g transform="translate(29,38)"><circle cx="28" cy="18" r="6" fill="#fff" stroke="#2E7D63" stroke-width="1.6" opacity=".5"/><circle cx="74" cy="30" r="6" fill="#fff" stroke="#C0562F" stroke-width="1.6" opacity=".5"/><circle cx="122" cy="14" r="6" fill="#fff" stroke="#2E7D63" stroke-width="1.6" opacity=".5"/><circle cx="158" cy="34" r="6" fill="#fff" stroke="#C0562F" stroke-width="1.6" opacity=".5"/><circle cx="52" cy="42" r="6" fill="#fff" stroke="#2E7D63" stroke-width="1.6" opacity=".5"/><path d="M91,54 L95,60 L99,54" fill="none" stroke="#8C9491" stroke-width="1.4"/><line x1="14" y1="72" x2="180" y2="72" stroke="#E6E7E3" stroke-width="1.5"/><circle cx="26" cy="72" r="7" fill="#1B4D3E" opacity="0.30"/><circle cx="62" cy="72" r="7" fill="#1B4D3E" opacity="0.44"/><circle cx="98" cy="72" r="7" fill="#1B4D3E" opacity="0.58"/><circle cx="134" cy="72" r="7" fill="#1B4D3E" opacity="0.72"/><circle cx="170" cy="72" r="7" fill="#1B4D3E" opacity="0.86"/></g>
<text x="12" y="150" font-size="10.5" fill="#5D6764">Can every node sort the same</text>
<text x="12" y="166" font-size="10.5" fill="#5D6764">events into the same sequence,</text>
<text x="12" y="182" font-size="10.5" fill="#5D6764">with no ties left over?</text>
</g>
</svg>